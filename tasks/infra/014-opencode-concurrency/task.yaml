id: infra/014
slug: opencode-concurrency
title: "Ограничение параллельности агента: concurrency для opencode.yml"
track: lite
queue:
  rationale: "Найдено самопроверкой 2026-08-31. У opencode.yml нет блока concurrency: очередь комментариев с командой поднимает несколько агентов параллельно, каждый со своим OIDC-обменом и своей сессией провайдера. На бесплатной модели цена — минуты Actions, но при переходе на платную это множитель расходов. Решать: группа по номеру issue или PR (github.event.issue.number), cancel-in-progress скорее false — обрывать начатый ответ агента хуже, чем дать ему договорить. Проверить заодно, не мешает ли группировка авто-ревью и комментарийному вызову идти одновременно на одном PR"
gates:
  setup:
    status: черновик
  result:
    status: черновик
