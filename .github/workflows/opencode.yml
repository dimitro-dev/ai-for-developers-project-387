name: opencode

# Агент OpenCode в GitHub Actions. Права на запись даёт установленный GitHub App
# `opencode-agent`: workflow лишь обменивает OIDC-токен раннера на installation-токен,
# поэтому объявлен только `id-token: write`. Ключ провайдера живёт в Actions secrets —
# в репозитории его нет, в лог он не попадает.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  # Ручной вызов: `/oc` или `/opencode` в комментарии к issue или к строке кода в PR.
  # Комментарии ботов отсеиваются: `contains` ищет подстроку, а ответ агента упоминает путь
  # `.github/workflows/opencode.yml`, внутри которого есть `/opencode`, — без фильтра агент
  # перезапускает сам себя (наблюдалось на прогоне 33306960256).
  # Фильтра по автору нет намеренно (решение владельца, infra/010): цена чужого запуска
  # ограничена бесплатной моделью. Переход на платную модель обязан вернуть условие
  # `github.event.comment.author_association == 'OWNER'`.
  comment:
    if: |
      github.event_name != 'pull_request' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Стороннее действие закреплено по commit SHA — коммит тега github-v1.2.25.
      # Плавающий @latest не следит за выпусками и устаревает (anomalyco/opencode#19865).
      # Обновление — осознанная правка SHA под новый тег.
      - uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          # Вход `share` по умолчанию `true` для публичных репозиториев: транскрипт
          # сессии публиковался бы по share-ссылке. Публикация выбирается явно.
          share: false

  # Автоматическое ревью. Два условия сверх события: черновики не трогаем, а PR из форка
  # пропускаем — GitHub не передаёт секреты workflow'у на `pull_request` из форка,
  # и job упал бы на пустом OPENCODE_API_KEY. Комментариев это не касается:
  # `issue_comment` исполняется в контексте базового репозитория и секреты видит.
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Сделай ревью этого pull request на русском языке: корректность,
            соответствие правилам репозитория из AGENTS.md затронутых зон,
            риски. Только комментарий — не пушь коммиты и не открывай PR.
