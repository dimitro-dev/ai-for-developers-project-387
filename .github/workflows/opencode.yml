name: opencode

# Агент OpenCode в GitHub Actions. Права на запись даёт установленный GitHub App
# `opencode-agent`: workflow лишь обменивает OIDC-токен раннера на installation-токен,
# поэтому объявлен только `id-token: write`. Ключ провайдера живёт в Actions secrets —
# в репозитории его нет, в лог он не попадает.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  # Ручной вызов: `/oc` или `/opencode` в начале строки комментария к issue или к строке
  # кода в PR. Выражения Actions регулярных выражений не поддерживают, поэтому команду
  # распознаёт отдельный job, а `comment` читает его выход. `contains` здесь только
  # предфильтр: он решает не «звать ли агента», а «стоит ли ради разбора поднимать раннер»,
  # иначе `detect` вставал бы на каждый комментарий в репозитории.
  # Комментарии ботов отсеиваются: ответ агента упоминает путь
  # `.github/workflows/opencode.yml`, который проходит предфильтр, и на одной подстроке
  # агент перезапускал сам себя (наблюдалось на прогоне 33306960256).
  # Фильтра по автору нет намеренно (решение владельца, infra/010): цена чужого запуска
  # ограничена бесплатной моделью. Переход на платную модель обязан вернуть условие
  # `github.event.comment.author_association == 'OWNER'`.
  detect:
    if: |
      github.event_name != 'pull_request' &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    # Один grep без checkout — работа на секунды, лимит короче, чем у job'ов с агентом.
    timeout-minutes: 5
    # Ни checkout, ни обмена OIDC, ни обращений к API: job'у не нужно вообще ничего.
    permissions: {}
    outputs:
      command: ${{ steps.check.outputs.command }}
    steps:
      - id: check
        # Тело комментария приходит переменной окружения, а не подстановкой `${{ }}`
        # в скрипт: иначе текст любого пользователя GitHub попал бы в исполняемый скрипт
        # буквально, и закрывающая кавычка выполнила бы на раннере произвольную команду.
        # Через `env` тело остаётся данными: значение переменной, а не часть команды.
        env:
          BODY: ${{ github.event.comment.body }}
        # `grep` разбирает построчно, поэтому команда засчитывается и во второй строке —
        # так её и пишут, после пояснения. `^` без ведущих пробелов отсекает отступ
        # markdown-блока, то есть цитирование, хвостовое `([[:space:]]|$)` — путь
        # `/opencode.yml`. `[[:space:]]` покрывает и `\r`, если тело придёт с CRLF.
        run: |
          if printf '%s' "$BODY" | grep -qE '^/(oc|opencode)([[:space:]]|$)'; then
            echo 'command=true' >> "$GITHUB_OUTPUT"
          else
            echo 'command=false' >> "$GITHUB_OUTPUT"
          fi

  comment:
    needs: detect
    # Выходы job'ов в Actions — всегда строки, поэтому сравнение только со строкой.
    if: needs.detect.outputs.command == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          # Вход `share` по умолчанию `true` для публичных репозиториев: транскрипт
          # сессии публиковался бы по share-ссылке. Публикация выбирается явно.
          share: false

  # Автоматическое ревью. Два условия сверх события: черновики не трогаем, а PR из форка
  # пропускаем — GitHub не передаёт секреты workflow'у на `pull_request` из форка,
  # и job упал бы на пустом OPENCODE_API_KEY. Комментариев это не касается:
  # `issue_comment` исполняется в контексте базового репозитория и секреты видит.
  review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: false
          prompt: |
            Сделай ревью этого pull request на русском языке: корректность,
            соответствие правилам репозитория из AGENTS.md затронутых зон,
            риски. Только комментарий — не пушь коммиты и не открывай PR.
